name: Production Release Gate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: Production release gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quizapp_gate
          POSTGRES_USER: quizapp_gate
          POSTGRES_PASSWORD: quizapp_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizapp_gate -d quizapp_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RELEASE_GATE_REPORT_DIR: release-gate-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci

      - name: Source integrity
        run: npm run gate:source-integrity

      - name: Secret scan
        run: npm run gate:secret-scan

      - name: Validate production env validator accepts safe fixture
        env:
          DATABASE_URL: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres
          DATABASE_USERNAME: release_gate_user
          DATABASE_PASSWORD: release-gate-password-value
          GOOGLE_CLIENT_ID: release-gate-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: release-gate-oauth-secret-value
          FRONTEND_URL: https://quiz-app-rust-iota-39.vercel.app
          OAUTH_SUCCESS_REDIRECT_URI: https://quiz-app-rust-iota-39.vercel.app/index.html
          CORS_ALLOWED_ORIGINS: https://quiz-app-rust-iota-39.vercel.app
          SESSION_COOKIE_SECURE: "true"
          SESSION_COOKIE_SAME_SITE: none
          SESSION_COOKIE_PATH: /
          JPA_DDL_AUTO: validate
          FLYWAY_ENABLED: "true"
          FLYWAY_BASELINE_ON_MIGRATE: "false"
          SPRING_PROFILES_ACTIVE: prod
          RATE_LIMIT_MODE: in-memory
          AI_EXPLAIN_RATE_LIMIT_PER_MINUTE: "10"
          AI_EXPLAIN_RATE_LIMIT_PER_DAY: "100"
          AI_DECK_RATE_LIMIT_PER_MINUTE: "3"
          AI_DECK_RATE_LIMIT_PER_DAY: "20"
          MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
          LOGGING_LEVEL_ROOT: INFO
        run: npm run gate:validate-env -- --control=production-env-validator-self-test --self-test

      - name: Validate deployed production env
        continue-on-error: true
        env:
          RELEASE_ENV_SOURCE: ${{ vars.RELEASE_ENV_SOURCE }}
          RELEASE_DEPLOYMENT_ID: ${{ vars.RELEASE_DEPLOYMENT_ID }}
          RELEASE_ENV_CAPTURED_AT: ${{ vars.RELEASE_ENV_CAPTURED_AT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          OAUTH_SUCCESS_REDIRECT_URI: ${{ vars.OAUTH_SUCCESS_REDIRECT_URI }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          SESSION_COOKIE_SECURE: ${{ vars.SESSION_COOKIE_SECURE }}
          SESSION_COOKIE_SAME_SITE: ${{ vars.SESSION_COOKIE_SAME_SITE }}
          SESSION_COOKIE_PATH: ${{ vars.SESSION_COOKIE_PATH }}
          JPA_DDL_AUTO: ${{ vars.JPA_DDL_AUTO }}
          FLYWAY_ENABLED: ${{ vars.FLYWAY_ENABLED }}
          FLYWAY_BASELINE_ON_MIGRATE: ${{ vars.FLYWAY_BASELINE_ON_MIGRATE }}
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
          RATE_LIMIT_MODE: ${{ vars.RATE_LIMIT_MODE }}
          AI_EXPLAIN_RATE_LIMIT_PER_MINUTE: ${{ vars.AI_EXPLAIN_RATE_LIMIT_PER_MINUTE }}
          AI_EXPLAIN_RATE_LIMIT_PER_DAY: ${{ vars.AI_EXPLAIN_RATE_LIMIT_PER_DAY }}
          AI_DECK_RATE_LIMIT_PER_MINUTE: ${{ vars.AI_DECK_RATE_LIMIT_PER_MINUTE }}
          AI_DECK_RATE_LIMIT_PER_DAY: ${{ vars.AI_DECK_RATE_LIMIT_PER_DAY }}
          MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${{ vars.MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE }}
          LOGGING_LEVEL_ROOT: ${{ vars.LOGGING_LEVEL_ROOT }}
        run: npm run gate:validate-env -- --control=production-env-validation

      - name: Validate production env rejects unsafe fixture
        env:
          DATABASE_URL: jdbc:h2:mem:test
          DATABASE_USERNAME: sa
          DATABASE_PASSWORD: password
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: secret
          FRONTEND_URL: http://localhost:5500
          OAUTH_SUCCESS_REDIRECT_URI: http://localhost:5500/index.html
          CORS_ALLOWED_ORIGINS: "*"
          SESSION_COOKIE_SECURE: "false"
          SESSION_COOKIE_SAME_SITE: none
          SESSION_COOKIE_PATH: /
          JPA_DDL_AUTO: update
          FLYWAY_ENABLED: "false"
          FLYWAY_BASELINE_ON_MIGRATE: "true"
          SPRING_PROFILES_ACTIVE: prod
          RATE_LIMIT_MODE: redis
          AI_EXPLAIN_RATE_LIMIT_PER_MINUTE: "0"
          AI_EXPLAIN_RATE_LIMIT_PER_DAY: "-1"
          AI_DECK_RATE_LIMIT_PER_MINUTE: "0"
          AI_DECK_RATE_LIMIT_PER_DAY: "-1"
          MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
          LOGGING_LEVEL_ROOT: DEBUG
        run: npm run gate:validate-env -- --control=production-env-invalid-fixture --expect-invalid

      - name: Backend full test
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify
          cd ..
          node scripts/production-release-gate/mark-control.mjs backend-full-test PASS "All backend tests and JaCoCo coverage gate completed."

      - name: Security regression tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=BackendHardeningTests,CsrfSecurityTests test
          cd ..
          node scripts/production-release-gate/mark-control.mjs security-regression-tests PASS "Backend hardening and CSRF tests completed."

      - name: Observability and rate-limit controls
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=ObservabilityAndRateLimitTests,AiRateLimitTests test
          cd ..
          node scripts/production-release-gate/mark-control.mjs observability-rate-limit-controls PASS "Request ID, protected metrics policy, health, AI rate-limit, and failure counters completed."

      - name: Frontend lint
        run: npm run lint

      - name: Frontend CSS asset ownership
        run: npm run test:assets

      - name: Frontend inline style ratchet
        run: npm run test:frontend-inline-styles

      - name: Frontend import helper characterization
        run: npm run test:frontend-import-helpers

      - name: Frontend sync status helper characterization
        run: npm run test:frontend-sync-status

      - name: Frontend session UI helper characterization
        run: npm run test:frontend-session-ui

      - name: Frontend static build
        run: npm run build:frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Frontend Playwright smoke
        run: |
          npx playwright test --reporter=html,list
          node scripts/production-release-gate/mark-control.mjs frontend-playwright-smoke PASS "Playwright smoke suite completed."

      - name: Flyway rehearsal against temporary PostgreSQL
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          DATABASE_URL: jdbc:postgresql://localhost:5432/quizapp_gate
          DATABASE_USERNAME: quizapp_gate
          DATABASE_PASSWORD: quizapp_gate
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
        run: |
          chmod +x mvnw
          mkdir -p ../release-gate-artifacts
          ./mvnw -B -Dtest=QuizApplicationTests test | tee ../release-gate-artifacts/flyway-rehearsal-first.log
          ./mvnw -B -Dtest=QuizApplicationTests test | tee ../release-gate-artifacts/flyway-rehearsal-repeat.log
          cd ..
          node scripts/production-release-gate/mark-control.mjs flyway-rehearsal PASS "Fresh PostgreSQL migration plus repeat validate completed."

      - name: Two-device sync controls
        run: |
          cd backend
          ./mvnw -B -Dtest=SyncContractV2Tests test
          cd ..
          npx playwright test --grep "legacy local word|sync revision conflict|stale returning device|failed direct cloud delete|delete queue"
          node scripts/production-release-gate/mark-control.mjs two-device-sync PASS "Backend SyncContractV2Tests and targeted frontend sync smoke tests completed."

      - name: Backup and rollback readiness
        if: always()
        run: npm run gate:backup-rollback

      - name: Staging smoke
        if: always()
        env:
          STAGING_BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
          STAGING_FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
          STAGING_TEST_USER_HINT: ${{ secrets.STAGING_TEST_USER_HINT }}
        run: npm run gate:staging-smoke

      - name: Collect backend test reports
        if: always()
        run: |
          mkdir -p release-gate-artifacts/backend-surefire
          cp -R backend/target/surefire-reports/. release-gate-artifacts/backend-surefire/ 2>/dev/null || true

      - name: Generate final release gate report
        if: always()
        run: npm run gate:report

      - name: Upload production release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-gate-report
          path: release-gate-artifacts/
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
