name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Backend tests and frontend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quizapp_ci
          POSTGRES_USER: quizapp_ci
          POSTGRES_PASSWORD: quizapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizapp_ci -d quizapp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Run production database safety guards
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=ProductionDatabaseSafetyGuardTests test

      - name: Run PostgreSQL Flyway migration and Hibernate validate
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          DATABASE_URL: jdbc:postgresql://localhost:5432/quizapp_ci
          DATABASE_USERNAME: quizapp_ci
          DATABASE_PASSWORD: quizapp_ci
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=QuizApplicationTests test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: |
          node -e "
          const { readdirSync } = require('node:fs');
          const { join } = require('node:path');
          const { spawnSync } = require('node:child_process');

          function collectJsFiles(dir) {
            return readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = join(dir, entry.name);
              if (entry.isDirectory()) return collectJsFiles(fullPath);
              return entry.isFile() && entry.name.endsWith('.js') ? [fullPath] : [];
            });
          }

          const files = collectJsFiles('frontend/js');
          for (const file of files) {
            const result = spawnSync(process.execPath, ['--check', file], { stdio: 'inherit' });
            if (result.status !== 0) process.exit(result.status || 1);
          }

          console.log('Checked ' + files.length + ' frontend JavaScript files.');
          "

      - name: Install frontend smoke test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke tests
        run: npm run test:frontend
