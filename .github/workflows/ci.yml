name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Backend tests and frontend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quizapp_ci
          POSTGRES_USER: quizapp_ci
          POSTGRES_PASSWORD: quizapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizapp_ci -d quizapp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests and coverage gate
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Run production database safety guards
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=ProductionDatabaseSafetyGuardTests test

      - name: Run PostgreSQL Flyway migration and Hibernate validate
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          DATABASE_URL: jdbc:postgresql://localhost:5432/quizapp_ci
          DATABASE_USERNAME: quizapp_ci
          DATABASE_PASSWORD: quizapp_ci
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=QuizApplicationTests test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend check dependencies
        run: npm ci

      - name: Check frontend JavaScript syntax
        run: npm run check:frontend

      - name: Check frontend CSS assets
        run: npm run test:assets

      - name: Test frontend import helpers
        run: npm run test:frontend-import-helpers

      - name: Test frontend sync status helpers
        run: npm run test:frontend-sync-status

      - name: Run frontend lint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke tests
        run: npm run test:frontend
