spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:./config/oauth2-google.yml
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

app:
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:5500}
    origin: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://127.0.0.1:5500,http://localhost:5500}}
  oauth2:
    success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT_URI:${app.frontend.base-url}/frontend/index.html}
    logout-redirect-uri: ${OAUTH_LOGOUT_REDIRECT_URI:${app.frontend.base-url}/frontend/login.html?loggedOut=true}

ai:
  model: ${AI_MODEL:gpt-4.1-mini}
  openai:
    api-key: ${OPENAI_API_KEY:}
    responses-url: https://api.openai.com/v1/responses
