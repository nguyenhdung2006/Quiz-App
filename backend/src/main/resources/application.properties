spring.application.name=quizapp

# Defaults to H2 for quick local startup. Set DATABASE_URL, DATABASE_USERNAME,
# and DATABASE_PASSWORD to run against PostgreSQL.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:quizapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Flyway is prepared for PostgreSQL but disabled by default so H2 tests and
# existing production databases are not migrated until explicitly verified.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=${FLYWAY_BASELINE_DESCRIPTION:Existing production schema baseline}
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# This backend serves REST APIs; the frontend lives in ../frontend.
spring.thymeleaf.check-template-location=false

# Minimal production observability. Only expose safe actuator endpoints.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level logger=%logger{36} requestId=%X{requestId:-none} message="%replace(%msg){'[\r\n]+',' '}"%n%wEx

info.app.name=WordArena
info.app.version=${APP_VERSION:0.0.1-SNAPSHOT}
info.app.environment=${APP_ENV:${spring.profiles.active:local}}
