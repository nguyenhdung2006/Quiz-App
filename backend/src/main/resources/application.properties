spring.application.name=quizapp

# Defaults to H2 for quick local startup. Set DATABASE_URL, DATABASE_USERNAME,
# and DATABASE_PASSWORD to run against PostgreSQL.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:quizapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
